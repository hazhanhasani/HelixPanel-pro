name: Package cPanel & DirectAdmin Master Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hosting-master/**'
      - '.github/workflows/hosting-master-package.yml'

permissions:
  contents: read

jobs:
  build-hosting-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP package
        run: |
          php -l hosting-master/public/index.php
          php -l hosting-master/public/auto-update.php
          php -l tests/test_hosting_updater.php
          php tests/test_hosting_updater.php
          php -l hosting-master/config.example.php
          php -l hosting-master/private/store.php
          php -l hosting-master/public/node.php
          php -l hosting-master/public/setup.php
          php -l hosting-master/public/license.php
          php -l hosting-master/public/assets/../../private/store.php
          php tests/master_smoke.php | grep -q 'ورود به مستر پنل'
          python3 -m unittest discover -s tests -p 'test_dashboard_v2.py' -v
          node --check hosting-master/public/assets/dashboard-v2.js
      - name: Build a safe upload bundle
        run: |
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          stage = pathlib.Path("/tmp/helixpanel-master-package")
          shutil.rmtree(stage, ignore_errors=True)
          public = stage / "upload-to-public_html"
          private = stage / "place-outside-public_html" / ".helixpanel-master"
          (public / "assets").mkdir(parents=True)
          private.mkdir(parents=True)
          shutil.copy2("hosting-master/public/index.php", public / "index.php")
          shutil.copy2("hosting-master/public/auto-update.php", public / "auto-update.php")
          shutil.copy2("hosting-master/public/node.php", public / "node.php")
          shutil.copy2("hosting-master/public/setup.php", public / "setup.php")
          shutil.copy2("hosting-master/public/license.php", public / "license.php")
          # Read-only private storage source for the first-run wizard, guarded by PHP.
          shutil.copy2("hosting-master/private/store.php", public / "setup-store.php")
          shutil.copy2("hosting-master/public/assets/master.css", public / "assets/master.css")
          shutil.copy2("hosting-master/public/assets/dashboard-v2.css", public / "assets/dashboard-v2.css")
          shutil.copy2("hosting-master/public/assets/dashboard-v2.js", public / "assets/dashboard-v2.js")
          shutil.copy2("hosting-master/public/assets/setup.css", public / "assets/setup.css")
          shutil.copy2("hosting-master/public/assets/logo-mark.webp", public / "assets/logo-mark.webp")
          shutil.copy2("hosting-master/config.example.php", private / "config.example.php")
          shutil.copy2("hosting-master/private/store.php", private / "store.php")
          shutil.copy2("hosting-master/schema.sql", stage / "schema.sql")
          shutil.copy2("hosting-master/README.fa.md", stage / "README.fa.md")
          output = pathlib.Path("HelixPanel-Master-cPanel-DirectAdmin.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage))
          print(output.name, output.stat().st_size, "bytes")
          PY
      - name: Build dashboard-only upgrade package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('hosting-master/public')
          paths=['index.php','auto-update.php','assets/master.css','assets/dashboard-v2.css','assets/dashboard-v2.js','assets/logo-mark.webp']
          with zipfile.ZipFile('HelixPanel-Dashboard-V2-Update.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  source=root/name
                  if not source.is_file():
                      raise SystemExit(f'Missing dashboard file: {source}')
                  z.write(source,name)
          print('Dashboard-only archive ready; no config, database or license files are overwritten.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HelixPanel-Dashboard-V2-Update
          path: HelixPanel-Dashboard-V2-Update.zip
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HelixPanel-Master-cPanel-DirectAdmin
          path: HelixPanel-Master-cPanel-DirectAdmin.zip
          retention-days: 90
          if-no-files-found: error
