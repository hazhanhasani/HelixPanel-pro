name: Public installer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and security regression tests
        run: |
          bash -n install.sh
          python3 -m py_compile installer.py
          python3 -m unittest discover -s tests -v
      - name: Validate cPanel / DirectAdmin PHP master gateway
        run: |
          php -v
          php -l hosting-master/public/index.php
          php -l hosting-master/config.example.php
          php tests/master_smoke.php | grep -q 'ورود به مستر پنل'
          test ! -f hosting-master/public/config.php
          test ! -d hosting-master/public/.helixpanel-master
          test -f hosting-master/public/assets/master.css
      - name: Assert proprietary source and secrets are absent
        run: |
          test ! -d internal
          test ! -d cmd
          test ! -f license.key
          test ! -f config.json
          test ! -f vendor-private.key
