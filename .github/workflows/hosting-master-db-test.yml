name: Standalone PHP Master Database Test
on:
  push:
    branches: [main]
    paths:
      - 'hosting-master/**'
      - 'tests/test_hosted_mysql.php'
      - 'tests/test_hosting_setup.py'
      - '.github/workflows/hosting-master-db-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: helix_test
          MYSQL_USER: helix_ci
          MYSQL_PASSWORD: helix_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PHP MySQL driver
        run: |
          php -v
          if ! php -m | grep -qi '^pdo_mysql$'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq php-mysql
          fi
      - name: Test PHP master with live MySQL
        env:
          HP_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=helix_test;charset=utf8mb4"
          HP_TEST_USER: helix_ci
          HP_TEST_PASSWORD: helix_ci_password
        run: |
          php -l hosting-master/private/store.php
          php -l hosting-master/public/node.php
          php -l hosting-master/public/index.php
          php -l hosting-master/public/setup.php
          php tests/test_hosted_mysql.php
          python3 -m unittest discover -s tests -p test_hosting_setup.py -v
